name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: cp .env.example .env
      - run: python -m pytest
      - run: python scripts/check_coverage.py
      - run: ruff check quiz_app scripts
      - run: ruff format --check quiz_app scripts
      - run: mypy quiz_app
      - run: complexipy quiz_app scripts --max-complexity-allowed 10
      - run: npm run lint
      - run: npm test
